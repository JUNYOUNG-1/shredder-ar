<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>압축형 문서세단기</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
:root{--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--bg:#fbfbfd;--blue:#0071e3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
 font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:fixed;top:0;left:0;right:0;z-index:3;padding:22px 20px 10px;text-align:center;background:linear-gradient(var(--bg) 70%,#fbfbfd00)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--sub);font-weight:500}
h1{margin:6px 0 2px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.note{font-size:14px;color:var(--sub);min-height:20px;letter-spacing:-.01em}
model-viewer{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);--poster-color:transparent}
.dock{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:3;padding:0 16px;text-align:center}
.chips{display:flex;gap:8px;padding:4px 2px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 15px;font:inherit;font-size:14px;letter-spacing:-.01em}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
#ar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));border:0;background:var(--blue);color:#fff;border-radius:999px;padding:14px 34px;font:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em}
.msg{position:fixed;left:16px;right:16px;top:118px;z-index:5;display:none;padding:14px 16px;border-radius:14px;background:#fff;
 box-shadow:0 6px 24px #0000001f;font-size:14px;line-height:1.5;color:var(--ink)}
.msg a{display:inline-block;margin-top:8px;color:var(--blue);text-decoration:none;font-weight:600}
</style></head><body>
<header><div class="eyebrow" id="eb"></div><h1 id="tt"></h1><div class="note" id="nt"></div></header>
<div class="msg" id="inapp">카카오톡·네이버 앱 안에서는 AR이 열리지 않을 수 있습니다.<br><a id="ext" href="#">기본 브라우저로 열기 ›</a></div>
<div class="msg" id="fail">이 기기에서는 AR을 지원하지 않습니다. 화면을 손가락으로 돌려 보세요.</div>
<model-viewer id="mv" autoplay ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" ar-placement="floor"
 camera-controls touch-action="pan-y" shadow-intensity="0.9" shadow-softness="1" exposure="1.05" environment-image="neutral"
 camera-orbit="32deg 74deg auto" interaction-prompt="none"><button slot="ar-button" id="ar">AR로 보기</button></model-viewer>
<div class="dock"><div class="chips" id="chips"></div></div>
<script>
(async function () {
  var cfg = await fetch("config.json?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.json(); });
  var mv = document.getElementById("mv");
  document.getElementById("eb").textContent = cfg.eyebrow || "";
  document.getElementById("tt").textContent = cfg.title;
  document.title = cfg.title + " · " + (cfg.eyebrow || "");
  var box = document.getElementById("chips");
  function show(i) {
    var v = cfg.views[i];
    mv.src = v.glb; mv.cameraOrbit = v.orbit || "32deg 74deg auto";
    document.getElementById("nt").textContent = v.note || "";
    [].forEach.call(box.children, function (c, k) { c.className = "chip" + (k === i ? " on" : ""); });
    try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  }
  cfg.views.forEach(function (v, i) {
    var b = document.createElement("button"); b.className = "chip"; b.textContent = v.name;
    b.onclick = function () { show(i); }; box.appendChild(b);
  });
  if (cfg.views.length < 2) box.style.display = "none";
  var h = parseInt(location.hash.slice(1)) - 1;
  show(h >= 0 && h < cfg.views.length ? h : 0);
  var ua = navigator.userAgent, here = location.href.split("#")[0];
  if (/Android/i.test(ua) && /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(ua)) {
    document.getElementById("ext").href = /KAKAOTALK/i.test(ua) ? "kakaotalk://web/openExternal?url=" + encodeURIComponent(here)
      : "intent://" + here.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(here) + ";end";
    document.getElementById("inapp").style.display = "block";
  }
  mv.addEventListener("ar-status", function (e) { if (e.detail.status === "failed") document.getElementById("fail").style.display = "block"; });
})();
</script>
</body></html>
