<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모듈 적층식 압축 문서세단기</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
/* 뷰어 v3 (11/9): 확대·갤럭시 안내 줄 추가. v2: 굵기 400·500·600, 글자 12·14·16, 간격 4·8 배수, 누르는 곳 44 px 이상, 파랑은 AR 버튼 하나 */
:root{--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--hair:rgba(0,0,0,.08);--bg:#fbfbfd;--surface:#fff;--skel:#efeff2;--blue:#0071e3;
 --t-fast:150ms;--t-base:200ms}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
 font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{position:fixed;top:0;left:0;right:0;z-index:3;padding:24px 16px 8px;text-align:center;
 background:linear-gradient(var(--bg) 72%,rgba(251,251,253,0))}
.eyebrow{font-size:12px;line-height:1.4;font-weight:500;letter-spacing:.02em;color:var(--sub)}
h1{margin:4px 0;font-size:clamp(22px,6.4vw,28px);line-height:1.2;font-weight:600;letter-spacing:-.02em}
.note{max-width:40ch;margin:0 auto;font-size:14px;line-height:1.5;color:var(--sub);min-height:21px}

model-viewer{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);--poster-color:transparent}

/* 받는 동안: 기계 자리에 뼈대 + 가는 막대 (100 ms 넘을 때만) */
.skel{position:fixed;left:50%;top:50%;z-index:1;width:min(52vw,232px);height:min(50vh,400px);transform:translate(-50%,-46%);
 border-radius:16px;background:var(--skel);opacity:0;pointer-events:none;transition:opacity var(--t-base) ease-in}
.skel::before{content:"";position:absolute;left:0;right:0;top:0;height:18%;border-radius:16px 16px 4px 4px;background:#e4e4e8}
.bar{position:fixed;left:50%;bottom:calc(196px + env(safe-area-inset-bottom));z-index:3;width:96px;height:2px;margin-left:-48px;
 border-radius:2px;background:var(--line);overflow:hidden;opacity:0;transition:opacity var(--t-base) ease-in}
.bar i{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:left center;transition:transform var(--t-fast) ease-out}
.loading .skel,.loading .bar{opacity:1;transition-timing-function:ease-out}

.dock{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));z-index:3;padding:0 12px}
.chips{display:flex;gap:8px;padding:4px 0;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips>:first-child{margin-left:auto}.chips>:last-child{margin-right:auto}
.chip{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
 font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;flex:none;cursor:pointer;transition:background-color var(--t-fast) ease-out,color var(--t-fast) ease-out}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.hint{position:fixed;left:16px;right:16px;bottom:calc(140px + env(safe-area-inset-bottom));z-index:3;margin:0 auto;max-width:40ch;
 text-align:center;font-size:12px;line-height:1.5;color:var(--sub);pointer-events:none}
.hint span{display:block}
.hint .gx{display:none}
.android .hint .gx{display:block}
#ar,#noar{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:3;transform:translateX(-50%);
 min-height:48px;padding:0 32px;border:0;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;cursor:pointer}
#ar{position:absolute;background:var(--blue);color:#fff}
#noar{display:none;z-index:4;background:#e8e8ed;color:var(--ink);font-size:14px;font-weight:500}

.msg{position:fixed;left:16px;right:16px;top:128px;z-index:5;display:none;max-width:480px;margin:0 auto;padding:16px 48px 16px 16px;
 border:1px solid var(--hair);border-radius:16px;background:var(--surface);box-shadow:0 2px 16px rgba(0,0,0,.06);font-size:14px;line-height:1.5}
.msg .sub{color:var(--sub)}
.msg a{display:inline-flex;align-items:center;min-height:44px;margin-top:4px;color:var(--blue);text-decoration:none;font-weight:600}
.msg .x{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--sub);font-size:20px;line-height:1;cursor:pointer}

@media (prefers-reduced-motion: reduce){*,*::before{transition-duration:0ms!important}}
</style></head><body>
<header><div class="eyebrow" id="eb"></div><h1 id="tt"></h1><p class="note" id="nt"></p></header>
<div class="msg" id="inapp" role="status"><button class="x" type="button" aria-label="안내 닫기">×</button><span id="inapp_t"></span><br><a id="ext" href="#"></a></div>
<div class="msg" id="fail" role="alert"><button class="x" type="button" aria-label="안내 닫기">×</button>이 기기에서는 AR이 열리지 않아요. 화면을 손가락으로 돌려 보세요.<br>
 <span class="sub">갤럭시 등 안드로이드는 Chrome에서 열고, Play 스토어의 ‘Google Play AR 서비스’를 설치·업데이트해야 열립니다.</span></div>
<div class="skel" aria-hidden="true"></div>
<model-viewer id="mv" autoplay ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" ar-placement="floor"
 camera-controls touch-action="pan-y" shadow-intensity="0.9" shadow-softness="1" exposure="1.05" environment-image="neutral"
 camera-orbit="32deg 74deg auto" interaction-prompt="none"><button slot="ar-button" id="ar" type="button">AR로 보기</button></model-viewer>
<button id="noar" type="button">다른 브라우저로 열기</button>
<div class="bar" aria-hidden="true"><i id="bari"></i></div><span class="sr" id="live" aria-live="polite"></span>
<p class="hint" id="hint"><span>두 손가락으로 벌리면 확대, 한 손가락으로 끌면 돌아가요.</span><span class="gx">갤럭시는 AR이 잘 안 열릴 수 있어요. Chrome으로 열고 ‘Google Play AR 서비스’를 설치해 주세요.</span></p>
<nav class="dock" aria-label="보기 고르기"><div class="chips" id="chips"></div></nav>
<script>
(async function () {
  var cfg = await fetch("config.json?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.json(); });
  var mv = document.getElementById("mv"), body = document.body, live = document.getElementById("live"), bari = document.getElementById("bari");
  var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.getElementById("eb").textContent = cfg.eyebrow || "";
  document.getElementById("tt").textContent = cfg.title;
  document.title = cfg.title;
  [].forEach.call(document.querySelectorAll(".msg .x"), function (b) { b.onclick = function () { b.parentNode.style.display = "none"; }; });

  // 받는 중: 100 ms 넘게 걸릴 때만 뼈대·막대를 보여 줌 (짧으면 깜빡임이 더 거슬림)
  var tmr = 0, chk = 0, busy = false;
  function startLoad() { busy = true; clearTimeout(tmr); clearInterval(chk); bari.style.transform = "scaleX(0)"; mv.setAttribute("aria-busy", "true");
    tmr = setTimeout(function () { if (busy) { body.classList.add("loading"); live.textContent = "모델을 받는 중"; } }, 100);
    // 마지막 신호(100 %·load)가 안 오는 기기도 있어서, 다 받은 상태가 되면 끔
    setTimeout(function () { chk = setInterval(function () { if (mv.loaded) endLoad(); }, 300); }, 300); }
  function endLoad() { busy = false; clearTimeout(tmr); clearInterval(chk); body.classList.remove("loading"); mv.removeAttribute("aria-busy"); live.textContent = ""; }
  mv.addEventListener("progress", function (e) { var p = e.detail.totalProgress; bari.style.transform = "scaleX(" + p.toFixed(3) + ")"; if (p >= 0.95) endLoad(); });
  mv.addEventListener("load", endLoad); mv.addEventListener("error", endLoad);

  // 지금 보기를 다 받으면 다음 보기 모델을 미리 받아 둠 (데이터 절약 모드면 안 함)
  var box = document.getElementById("chips"), cur = 0, got = {}, lastSrc = "";
  mv.addEventListener("load", function () {
    var c = navigator.connection; if (c && (c.saveData || /2g/.test(c.effectiveType || ""))) return;
    var n = cfg.views[(cur + 1) % cfg.views.length]; if (!n || got[n.glb]) return; got[n.glb] = 1;
    setTimeout(function () { fetch(n.glb).catch(function () {}); }, 1200);
  });
  function show(i) {
    var v = cfg.views[i];
    if (v.usdz) mv.setAttribute("ios-src", v.usdz); else mv.removeAttribute("ios-src");   // 아이폰 Quick Look 은 USDZ 를 바로 엶
    if (lastSrc !== v.glb) { startLoad(); lastSrc = v.glb; }
    mv.src = v.glb; mv.cameraOrbit = v.orbit || "32deg 74deg auto";
    document.getElementById("nt").textContent = v.note || "";
    [].forEach.call(box.children, function (c, k) { c.setAttribute("aria-pressed", k === i ? "true" : "false"); });
    var on = box.children[i]; if (on && box.scrollWidth > box.clientWidth) on.scrollIntoView({inline: "center", block: "nearest", behavior: calm ? "auto" : "smooth"});
    cur = i;
    try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  }
  cfg.views.forEach(function (v, i) {
    var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = v.name;
    b.onclick = function () { show(i); }; box.appendChild(b);
  });
  if (cfg.views.length < 2) box.style.display = "none";
  var h = parseInt(location.hash.slice(1)) - 1;
  show(h >= 0 && h < cfg.views.length ? h : 0);

  // 앱 안 브라우저(카카오톡·네이버·인스타 등)에서는 AR 이 안 열림 → 기본 브라우저로 넘기기
  var ua = navigator.userAgent, here = location.href.split("#")[0];
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  if (android) body.classList.add("android");
  var inapp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)|GSA\//i.test(ua);
  var ext = document.getElementById("ext"), t = document.getElementById("inapp_t");
  document.getElementById("noar").onclick = function () { document.getElementById("inapp").style.display = "block"; };
  if (inapp && (ios || android)) {
    if (/KAKAOTALK/i.test(ua)) { ext.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(here); }
    else if (android) { ext.href = "intent://" + here.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(here) + ";end"; }
    else { ext.removeAttribute("href"); }
    ext.textContent = ios ? "Safari로 열기 ›" : "Chrome으로 열기 ›";
    t.textContent = ios ? "앱 안에서 열린 화면이라 AR이 열리지 않아요. 오른쪽 아래 ··· 에서 ‘Safari로 열기’를 눌러 주세요."
                        : "앱 안에서 열린 화면이라 AR이 열리지 않을 수 있어요. Chrome으로 열어 주세요.";
    document.getElementById("inapp").style.display = "block";
  }
  // 모델을 다 받은 뒤에도 AR 을 못 여는 브라우저면 버튼 자리에 안내
  mv.addEventListener("load", function () {
    if (!mv.canActivateAR && (ios || android)) {
      document.getElementById("noar").style.display = "block";
      if (!t.textContent) {
        t.textContent = ios ? "이 브라우저에서는 AR이 열리지 않아요. Safari로 열어 주세요." : "이 브라우저에서는 AR이 열리지 않아요. Chrome으로 열어 주세요.";
        if (android) { ext.href = "intent://" + here.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end"; ext.textContent = "Chrome으로 열기 ›"; }
      }
    }
  });
  mv.addEventListener("ar-status", function (e) { if (e.detail.status === "failed") document.getElementById("fail").style.display = "block"; });
})();
</script>
</body></html>
