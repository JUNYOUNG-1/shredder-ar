<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모듈 적층식 압축 문서세단기</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
:root{--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--bg:#fbfbfd;--blue:#0071e3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
 font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:fixed;top:0;left:0;right:0;z-index:3;padding:22px 20px 10px;text-align:center;background:linear-gradient(var(--bg) 70%,#fbfbfd00)}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--sub);font-weight:500}
h1{margin:6px 0 2px;font-size:clamp(21px,6.6vw,28px);font-weight:700;letter-spacing:-.02em}
.note{font-size:14px;color:var(--sub);min-height:20px;letter-spacing:-.01em}
model-viewer{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);--poster-color:transparent}
.dock{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:3;padding:0 16px;text-align:center}
.chips{display:flex;gap:6px;padding:4px 2px;justify-content:center;flex-wrap:nowrap;overflow-x:auto}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
#ar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));border:0;background:var(--blue);color:#fff;border-radius:999px;padding:14px 34px;font:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em}
#noar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:4;
 border:0;background:#e8e8ed;color:var(--sub);border-radius:999px;padding:14px 26px;font:inherit;font-size:15px;font-weight:600;white-space:nowrap}
.msg{position:fixed;left:16px;right:16px;top:118px;z-index:5;display:none;padding:14px 16px;border-radius:14px;background:#fff;
 box-shadow:0 6px 24px #0000001f;font-size:14px;line-height:1.5;color:var(--ink)}
.msg a{display:inline-block;margin-top:8px;color:var(--blue);text-decoration:none;font-weight:600}
.msg .x{float:right;color:var(--sub);font-size:18px;line-height:1;margin-left:8px;cursor:pointer}
</style></head><body>
<header><div class="eyebrow" id="eb"></div><h1 id="tt"></h1><div class="note" id="nt"></div></header>
<div class="msg" id="inapp"><span class="x" onclick="this.parentNode.style.display='none'">×</span><span id="inapp_t"></span><br><a id="ext" href="#"></a></div>
<div class="msg" id="fail"><span class="x" onclick="this.parentNode.style.display='none'">×</span>이 기기에서는 AR을 열 수 없습니다. 화면을 손가락으로 돌려 보세요.<br>
 <span style="color:#6e6e73">안드로이드는 Google 앱과 ‘Google Play AR 서비스’가 필요합니다.</span></div>
<model-viewer id="mv" autoplay ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" ar-placement="floor"
 camera-controls touch-action="pan-y" shadow-intensity="0.9" shadow-softness="1" exposure="1.05" environment-image="neutral"
 camera-orbit="32deg 74deg auto" interaction-prompt="none"><button slot="ar-button" id="ar">AR로 보기</button></model-viewer>
<button id="noar" onclick="document.getElementById('inapp').style.display='block'">AR은 Safari·Chrome에서 열려요</button>
<div class="dock"><div class="chips" id="chips"></div></div>
<script>
(async function () {
  var cfg = await fetch("config.json?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.json(); });
  var mv = document.getElementById("mv");
  document.getElementById("eb").textContent = cfg.eyebrow || "";
  document.getElementById("tt").textContent = cfg.title;
  document.title = cfg.title;
  var box = document.getElementById("chips");
  function show(i) {
    var v = cfg.views[i];
    if (v.usdz) mv.setAttribute("ios-src", v.usdz); else mv.removeAttribute("ios-src");   // 아이폰 Quick Look 은 USDZ 를 바로 엶
    mv.src = v.glb; mv.cameraOrbit = v.orbit || "32deg 74deg auto";
    document.getElementById("nt").textContent = v.note || "";
    [].forEach.call(box.children, function (c, k) { c.className = "chip" + (k === i ? " on" : ""); });
    try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  }
  cfg.views.forEach(function (v, i) {
    var b = document.createElement("button"); b.className = "chip"; b.textContent = v.name;
    b.onclick = function () { show(i); }; box.appendChild(b);
  });
  if (cfg.views.length < 2) box.style.display = "none";
  var h = parseInt(location.hash.slice(1)) - 1;
  show(h >= 0 && h < cfg.views.length ? h : 0);

  // 앱 안 브라우저(카카오톡·네이버·인스타 등)에서는 AR 이 안 열림 → 기본 브라우저로 넘기기
  var ua = navigator.userAgent, here = location.href.split("#")[0];
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var inapp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)|GSA\//i.test(ua);
  var ext = document.getElementById("ext"), t = document.getElementById("inapp_t");
  if (inapp && (ios || android)) {
    if (/KAKAOTALK/i.test(ua)) { ext.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(here); }
    else if (android) { ext.href = "intent://" + here.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(here) + ";end"; }
    else { ext.removeAttribute("href"); }
    ext.textContent = ios ? "Safari로 열기 ›" : "Chrome으로 열기 ›";
    t.textContent = ios ? "앱 안에서 열린 화면이라 AR이 안 열립니다. Safari로 열어 주세요. (오른쪽 아래 ··· → ‘Safari로 열기’)"
                        : "앱 안에서 열린 화면이라 AR이 안 열릴 수 있습니다. Chrome으로 열어 주세요.";
    document.getElementById("inapp").style.display = "block";
  }
  // 모델을 다 받은 뒤에도 AR 을 못 여는 브라우저면 버튼 자리에 안내
  mv.addEventListener("load", function () {
    if (!mv.canActivateAR && (ios || android)) {
      document.getElementById("noar").style.display = "block";
      if (!t.textContent) {
        t.textContent = ios ? "이 브라우저에서는 AR이 열리지 않습니다. Safari로 열어 주세요." : "이 브라우저에서는 AR이 열리지 않습니다. Chrome으로 열어 주세요.";
        if (android) { ext.href = "intent://" + here.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end"; ext.textContent = "Chrome으로 열기 ›"; }
      }
    }
  });
  mv.addEventListener("ar-status", function (e) { if (e.detail.status === "failed") document.getElementById("fail").style.display = "block"; });
})();
</script>
</body></html>
