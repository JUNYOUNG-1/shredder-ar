<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세단기 AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#fff;font-family:system-ui,"Malgun Gothic",sans-serif}
model-viewer{width:100%;height:100%;--poster-color:transparent;background:#fff}
#ar{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);padding:14px 34px;border:0;border-radius:28px;background:#1a5fd0;color:#fff;font-size:18px}
.vid{position:absolute;top:14px;right:14px;z-index:2;padding:8px 16px;border-radius:20px;background:#2a7a4b;color:#fff;font-size:14px;text-decoration:none}
</style></head><body>
<a class="vid" href="#v" onclick="var v=document.getElementById('v');v.style.display='block';v.play()">▶ 영상</a>
<video id="v" src="dust_compare.mp4" controls playsinline style="display:none;position:fixed;inset:0;width:100%;height:100%;background:#000;z-index:9"></video>
<model-viewer src="shredder_full.glb" alt="세단기" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls touch-action="pan-y"
  shadow-intensity="0" exposure="1" camera-orbit="35deg 75deg auto" interaction-prompt="none">
  <button slot="ar-button" id="ar">AR</button>
</model-viewer>
</body></html>
